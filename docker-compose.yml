# Local development: builds from the Dockerfile and runs it exactly like the
# server does (deploy/docker-compose.yml) — no volume mount, no --reload, so
# what you see locally is what the built image actually contains.
# Run with `docker compose up --build` to make sure you're testing a fresh build.
services:
  oblomow:
    build: .
    image: lustrum-oblomow:latest
    ports:
      - "8000:8000"