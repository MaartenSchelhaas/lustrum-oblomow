# Local development: builds from the Dockerfile, hot reload via the src mount.
# The server version lives in deploy/docker-compose.yml.
services:
  oblomow:
    build: .
    image: lustrum-oblomow:latest
    command: uv run uvicorn lustrum_oblomow.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src