[project]
name = "lustrum-oblomow"
version = "0.1.0"
description = "Site for Lustrum Oblomow"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lustrum_oblomow"]